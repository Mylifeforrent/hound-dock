<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>hound-dock — interaction prototype</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main" id="skip-link">Skip to main content</a>
  <div id="app" class="app-root"></div>
  <div id="review-root"></div>
  <div id="live-region" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <svg class="svg-sprite" aria-hidden="true" focusable="false" width="0" height="0">
    <symbol id="i-chat" viewBox="0 0 24 24">
      <path d="M4.5 5h15A1.5 1.5 0 0 1 21 6.5v9a1.5 1.5 0 0 1-1.5 1.5H10l-5.5 4v-4H4.5A1.5 1.5 0 0 1 3 15.5v-9A1.5 1.5 0 0 1 4.5 5Z"/>
    </symbol>
    <symbol id="i-skills" viewBox="0 0 24 24">
      <path d="M12 3 3.5 7.5 12 12l8.5-4.5L12 3Z"/>
      <path d="M3.5 12 12 16.5 20.5 12"/>
      <path d="M3.5 16.5 12 21l8.5-4.5"/>
    </symbol>
    <symbol id="i-mcp" viewBox="0 0 24 24">
      <path d="M9 3v5M15 3v5"/>
      <path d="M6 8h12v3a6 6 0 0 1-12 0V8Z"/>
      <path d="M12 17v4"/>
    </symbol>
    <symbol id="i-tasks" viewBox="0 0 24 24">
      <path d="M9 6h11M9 12h11M9 18h11"/>
      <path d="m3.5 6 1.5 1.5L7.5 5"/>
      <path d="m3.5 12 1.5 1.5L7.5 11"/>
      <path d="m3.5 18 1.5 1.5L7.5 17"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14"/>
    </symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24">
      <path d="M19 12H5M11 18l-6-6 6-6"/>
    </symbol>
    <symbol id="i-lock" viewBox="0 0 24 24">
      <path d="M7 10V7a5 5 0 0 1 10 0v3"/>
      <path d="M5 10h14v10H5V10Z"/>
    </symbol>
    <symbol id="i-alert" viewBox="0 0 24 24">
      <path d="M12 4 3.5 20h17L12 4Z"/>
      <path d="M12 10v4M12 17h.01"/>
    </symbol>
    <symbol id="i-info" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.5"/>
      <path d="M12 11v5M12 8h.01"/>
    </symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24">
      <path d="M20 12a8 8 0 1 1-2.3-5.7"/>
      <path d="M20 4v5h-5"/>
    </symbol>
    <symbol id="i-send" viewBox="0 0 24 24">
      <path d="M12 19V5M6 11l6-6 6 6"/>
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24">
      <path d="M6 6l12 12M18 6 6 18"/>
    </symbol>
    <symbol id="i-play" viewBox="0 0 24 24">
      <path d="M8 5v14l11-7L8 5Z"/>
    </symbol>
    <symbol id="i-layers" viewBox="0 0 24 24">
      <path d="m12 3 9 5-9 5-9-5 9-5Z"/>
      <path d="m3 13 9 5 9-5"/>
      <path d="m3 17 9 5 9-5"/>
    </symbol>
  </svg>

  <script src="app.js"></script>
</body>
</html>
